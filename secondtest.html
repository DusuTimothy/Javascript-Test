<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Second Test</title>
</head>

<body>

  <div id="box">Text to change colour</div>
  <button style="margin-top: 20px;" id="clickBtn">click To change</button>

  <div id="Blog-post"></div>

  <script>
    const boxDiv = document.getElementById('box')
    const button = document.getElementById('clickBtn')
    button.addEventListener("click", function () {
      boxDiv.textContent = 'Text changed'
      boxDiv.style.backgroundColor = "Navy"
      boxDiv.style.color = "Red"
      boxDiv.style.fontSize = "100px"
      boxDiv.style.marginBottom = "40px"

    })

    async function fetchData() {
      try {
        const response = await fetch('https://jsonplaceholder.typicode.com/posts');
        if (!response.ok) {
          throw new Error(`Error: ${response.status}`);
        }

        const data = await response.json();
        const postsArray = data;

        const htmlCards = postsArray.map(post => `
      <article class="blog-card">
        <h3>${post.title}</h3>
      </article>
    `);

        const container = document.getElementById('Blog-post');
        container.innerHTML = '<h2 style= "">Blog Post</h2>' +
          `<div style= "display: flex " class="blog-card-container">${htmlCards.join('')}</div>`;

      } catch (error) {
        console.error('Error handling post data:', error);
      }
    }
    fetchData();



  </script>
</body>

</html>
